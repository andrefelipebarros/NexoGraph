name: CI - Nexo Graph Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Faz o checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Configura o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'

      - name: 🧩 Instala as dependências
        run: npm ci

      - name: 🏗️ Faz o Build do Next.js
        run: npm run build
